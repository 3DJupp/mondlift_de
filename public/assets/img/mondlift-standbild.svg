<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"
     aria-label="Der Mondlift bei Nacht: ein geneigtes Riesenrad mit Gondeln und Lichterketten vor Mond und Sternen">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060e"/>
      <stop offset="0.5" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#19203a"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#fdfdf6"/>
      <stop offset="0.65" stop-color="#e4e8f1"/>
      <stop offset="1" stop-color="#b5bed2"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#cedcff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#96aae0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool">
      <stop offset="0" stop-color="#ffa846" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff781e" stop-opacity="0"/>
    </radialGradient>
    <g id="lamp"><circle r="4" fill="#ffd9a0"/><circle r="9" fill="#ffb04a" opacity="0.28"/></g>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="960" cy="150" r="190" fill="url(#halo)"/>
  <circle cx="960" cy="150" r="42" fill="url(#moon)"/>
  <g fill="#eef3ff">
    <circle cx="120" cy="90" r="1.6" opacity=".7"/><circle cx="300" cy="140" r="1.2" opacity=".5"/>
    <circle cx="520" cy="70" r="1.8" opacity=".8"/><circle cx="700" cy="190" r="1.1" opacity=".45"/>
    <circle cx="180" cy="300" r="1.4" opacity=".6"/><circle cx="1080" cy="320" r="1.5" opacity=".6"/>
    <circle cx="420" cy="250" r="1" opacity=".4"/><circle cx="860" cy="380" r="1.3" opacity=".5"/>
  </g>
  <ellipse cx="600" cy="720" rx="420" ry="90" fill="url(#pool)"/>

  <!-- Rad, leicht geneigt -->
  <g transform="translate(600 400) rotate(-12)" fill="none" stroke="#8e99ae">
    <ellipse rx="270" ry="258" stroke-width="7"/>
    <ellipse rx="248" ry="237" stroke-width="4" opacity=".8"/>
    <ellipse rx="112" ry="107" stroke-width="3" opacity=".7"/>
    <g stroke-width="4" opacity=".92">
      <path d="M0-258V258M-270 0H270M-191-182 191 182M191-182-191 182"/>
    </g>
    <g stroke-width="1.6" opacity=".55">
      <path d="M0 0-104-236M0 0 104-236M0 0-236-104M0 0 236-104M0 0-104 236M0 0 104 236M0 0-236 104M0 0 236 104"/>
    </g>
    <g stroke-width="2" opacity=".5">
      <path d="M-112 0-191-182M112 0 191-182M0-107 104-236M0 107-104 236M-112 0-191 182M112 0 191 182"/>
    </g>
    <circle r="26" fill="#3b3566" stroke="#2a3140" stroke-width="5"/>
    <g fill="#ffb04a" stroke="none">
      <circle cx="0" cy="-258" r="5"/><circle cx="182" cy="-182" r="5"/><circle cx="258" cy="0" r="5"/>
      <circle cx="182" cy="182" r="5"/><circle cx="0" cy="258" r="5"/><circle cx="-182" cy="182" r="5"/>
      <circle cx="-258" cy="0" r="5"/><circle cx="-182" cy="-182" r="5"/>
      <circle cx="0" cy="-150" r="4"/><circle cx="106" cy="-106" r="4"/><circle cx="150" cy="0" r="4"/>
      <circle cx="106" cy="106" r="4"/><circle cx="0" cy="150" r="4"/><circle cx="-106" cy="106" r="4"/>
      <circle cx="-150" cy="0" r="4"/><circle cx="-106" cy="-106" r="4"/>
    </g>
    <g stroke="none">
      <rect x="-32" y="-300" width="64" height="40" rx="12" fill="#2f6a66"/>
      <rect x="150" y="-240" width="64" height="40" rx="12" fill="#2c4a7a" transform="rotate(45 182 -220)"/>
      <rect x="226" y="-20" width="64" height="40" rx="12" fill="#7a3038"/>
      <rect x="150" y="200" width="64" height="40" rx="12" fill="#35603f" transform="rotate(-45 182 220)"/>
      <rect x="-32" y="260" width="64" height="40" rx="12" fill="#6d5a2c"/>
      <rect x="-214" y="200" width="64" height="40" rx="12" fill="#3a4150" transform="rotate(45 -182 220)"/>
      <rect x="-290" y="-20" width="64" height="40" rx="12" fill="#2f6a66"/>
      <rect x="-214" y="-240" width="64" height="40" rx="12" fill="#2c4a7a" transform="rotate(-45 -182 -220)"/>
    </g>
  </g>

  <!-- Unterbau -->
  <path d="M520 700h160l40 60H480z" fill="#2a3140"/>
  <path d="M596 420l8 260h-16z" fill="#2a3140"/>
  <rect x="430" y="756" width="340" height="16" rx="4" fill="#1b2230"/>
</svg>
